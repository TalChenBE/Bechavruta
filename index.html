.bc input{background:var(--pine);border:1.5px solid var(--line);color:var(--paper);border-radius:12px;padding:12px 14px;font-size:17px;width:100%}
.bc input::placeholder{color:#6F8A74}
.bc .row{display:flex;align-items:center;gap:14px;width:100%;text-align:right;padding:16px 2px;border-bottom:1px solid var(--line)}
.bc .chip{padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:16px;color:var(--paper)}
.bc .chip.on{background:var(--flame);color:#2A1C05;border-color:var(--flame);font-weight:700}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-1deg)}30%{transform:scale(1.06,.93) rotate(2deg)}60%{transform:scale(.95,1.06) rotate(-2deg)}}
.bc .flame{transform-origin:50% 95%;transform-box:fill-box;animation:flicker 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.bc .bomb{animation:pulse var(--beat,.6s) ease-in-out infinite}
@keyframes spark{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.5)}}
.bc .spark{transform-origin:center;transform-box:fill-box;animation:spark .22s linear infinite}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-10px,4px)}40%{transform:translate(9px,-6px)}60%{transform:translate(-7px,5px)}80%{transform:translate(6px,-3px)}}
.bc .shake{animation:shake .45s ease-in-out 2}
@keyframes flash{0%{background:#E5533D}45%{background:#8E2A1C}100%{background:#5A1A12}}
.bc .exploded{background:#5A1A12;animation:flash .9s ease-out}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
.bc .pop{display:inline-block;animation:pop .4s ease-out}
@media (prefers-reduced-motion:reduce){.bc *{animation:none!important;transition:none!important}}
/* \u05D4\u05E4\u05D5\u05D3\u05D9\u05D5\u05DD: \u05D1\u05E6\u05D3 \u05D1\u05DE\u05E1\u05DA \u05E8\u05D7\u05D1, \u05DE\u05E2\u05D5\u05D2\u05DF \u05DC\u05EA\u05D7\u05EA\u05D9\u05EA \u05D1\u05DE\u05E1\u05DA \u05E6\u05E8 */
.bc .pod-side{display:none}
.bc .pod-bar{display:flex}
.bc .with-pod{padding-bottom:68px}
@media (min-width:900px){
  .bc .pod-side{display:block}
  .bc .pod-bar{display:none}
  .bc .with-pod{padding-bottom:0}
}
